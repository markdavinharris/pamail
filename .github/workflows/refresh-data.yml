name: Refresh data

on:
  schedule:
    - cron: "17 11 * * *"   # every morning, 7:17 am EDT / 6:17 am EST
  workflow_dispatch: {}      # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BQ_PROJECT: coldspark-voterdata
      HAS_KEY: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - name: Check for BigQuery credentials
        if: env.HAS_KEY != 'true'
        run: |
          echo "::warning::GCP_SA_KEY secret is not set, so data.json was not refreshed. See README."

      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'

      - uses: actions/setup-python@v5
        if: env.HAS_KEY == 'true'
        with:
          python-version: "3.12"

      - name: Install BigQuery client
        if: env.HAS_KEY == 'true'
        run: pip install google-cloud-bigquery==3.25.0

      - uses: google-github-actions/auth@v2
        if: env.HAS_KEY == 'true'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Query BigQuery and write data.json
        if: env.HAS_KEY == 'true'
        run: python scripts/build_data.py

      - name: Commit data.json
        if: env.HAS_KEY == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then echo "No change in data."; exit 0; fi
          git commit -m "Refresh data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
